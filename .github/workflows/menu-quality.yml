name: Menu quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JS, menu and share preview contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check critical JavaScript syntax
        run: npm run check
      - name: Validate all menu, social, nutrition, share, photo reveal and UI regression contracts
        run: npm test
